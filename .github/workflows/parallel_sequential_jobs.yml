on: 
  workflow_dispatch:

jobs:
  job_1:
    runs-on: windows-latest
    steps:
      - run: echo "Running Job ${{ github.job }}"

  job_2:
    runs-on: windows-latest
    needs: job_1
    steps:
      - run: echo "Running Job ${{ github.job }}"

  job_3:
    runs-on: windows-latest
    needs: job_1
    steps: 
      - run: echo "Running Job ${{ github.job }}"

  job_4:
    runs-on: windows-latest
    needs: # Evaluated Using AND
      - job_2
      - job_3
    steps:
      - run: echo "Running Job ${{ github.job }}"

# Expected Running Flow : job_1 ---> job_2 & job_3 ---> job_4
      
